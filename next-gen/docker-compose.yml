version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
    image: staccato/erp:${APP_VERSION:-latest}
    container_name: staccato_app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL}
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
    volumes:
      - storage_logs:/var/www/html/storage/logs
      - storage_app:/var/www/html/storage/app
      - ssl_certs:/etc/letsencrypt
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - staccato_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: staccato/erp:${APP_VERSION:-latest}
    container_name: staccato_queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - app
      - redis
    networks:
      - staccato_network

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: staccato/erp:${APP_VERSION:-latest}
    container_name: staccato_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - app
    networks:
      - staccato_network

  db:
    image: postgres:16-alpine
    container_name: staccato_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - staccato_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: staccato_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - staccato_network

  backup:
    image: postgres:16-alpine
    container_name: staccato_backup
    restart: unless-stopped
    environment:
      - PGHOST=db
      - PGUSER=${DB_USERNAME}
      - PGPASSWORD=${DB_PASSWORD}
      - PGDATABASE=${DB_DATABASE}
    volumes:
      - backups:/backups
      - ./docker/scripts/backup.sh:/backup.sh
    command: >
      sh -c "while true; do
        /backup.sh;
        sleep 86400;
      done"
    depends_on:
      - db
    networks:
      - staccato_network

volumes:
  postgres_data:
  redis_data:
  storage_logs:
  storage_app:
  ssl_certs:
  backups:

networks:
  staccato_network:
    driver: bridge

openapi: 3.1.0
info:
  title: Staccato ERP API
  description: |
    Complete RESTful API specification for Staccato ERP system - Brazilian business management platform.

    **Authentication**: All endpoints require Bearer token (Sanctum API Token)

    **Base URL**: `/api`

    **Modules**:
    - Cadastros (Catalog management)
    - Estoque (Inventory management)
    - Vendas (Sales management)
    - Compras (Purchase management)
    - Financeiro (Financial management)
    - Logística (Logistics management)
    - NFe (Electronic invoicing)
  version: 1.0.0
  contact:
    name: Staccato ERP Team
    url: https://staccato.com.br
  license:
    name: Proprietary
    url: https://staccato.com.br/license

servers:
  - url: http://localhost:8000/api
    description: Local development
  - url: https://api.staccato.com.br/api
    description: Production

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: Sanctum API token authentication

  schemas:
    # ============================================
    # SHARED SCHEMAS
    # ============================================

    Pagination:
      type: object
      properties:
        data:
          type: array
        pagination:
          type: object
          properties:
            total:
              type: integer
              example: 156
            per_page:
              type: integer
              example: 15
            current_page:
              type: integer
              example: 1
            last_page:
              type: integer
              example: 11
            from:
              type: integer
              example: 1
            to:
              type: integer
              example: 15

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Not Found"
        message:
          type: string
          example: "Recurso não encontrado"
        code:
          type: integer
          example: 404

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: "Validation failed"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
            example: ["Campo obrigatório"]

    # ============================================
    # CADASTROS (CATALOG) SCHEMAS
    # ============================================

    Loja:
      type: object
      properties:
        id:
          type: integer
          example: 1
        codigo:
          type: string
          example: "01"
        nome:
          type: string
          example: "Loja Centro"
        cnpj:
          type: string
          example: "12.345.678/0001-90"
        inscricao_estadual:
          type: string
          example: "123.456.789.012"
        is_ativo:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LojaCreate:
      type: object
      required:
        - codigo
        - nome
        - cnpj
      properties:
        codigo:
          type: string
          maxLength: 10
        nome:
          type: string
          maxLength: 255
        cnpj:
          type: string
          pattern: '^\d{2}\.\d{3}\.\d{3}/\d{4}-\d{2}$'
        inscricao_estadual:
          type: string
          maxLength: 20
        is_ativo:
          type: boolean
          default: true

    Cliente:
      type: object
      properties:
        id:
          type: integer
        loja_id:
          type: integer
        tipo:
          type: string
          enum: [PF, PJ]
          description: "PF = Pessoa Física, PJ = Pessoa Jurídica"
        nome_razao:
          type: string
        nome_fantasia:
          type: string
        cpf_cnpj:
          type: string
        inscricao_estadual:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
        limite_credito:
          type: number
          format: decimal
        saldo_credito:
          type: number
          format: decimal
        is_incompleto:
          type: boolean
        is_ativo:
          type: boolean
        vendedor_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClienteCreate:
      type: object
      required:
        - loja_id
        - tipo
        - nome_razao
        - cpf_cnpj
      properties:
        loja_id:
          type: integer
        tipo:
          type: string
          enum: [PF, PJ]
        nome_razao:
          type: string
          maxLength: 255
        nome_fantasia:
          type: string
          maxLength: 255
          nullable: true
        cpf_cnpj:
          type: string
          maxLength: 20
        inscricao_estadual:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        telefone:
          type: string
          maxLength: 20
          nullable: true
        limite_credito:
          type: number
          format: decimal
          nullable: true
        vendedor_id:
          type: integer
          nullable: true
        is_ativo:
          type: boolean
          default: true

    Fornecedor:
      type: object
      properties:
        id:
          type: integer
        razao_social:
          type: string
        nome_fantasia:
          type: string
        cnpj:
          type: string
        inscricao_estadual:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
        is_ativo:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FornecedorCreate:
      type: object
      required:
        - razao_social
        - cnpj
      properties:
        razao_social:
          type: string
          maxLength: 255
        nome_fantasia:
          type: string
          maxLength: 255
          nullable: true
        cnpj:
          type: string
          pattern: '^\d{2}\.\d{3}\.\d{3}/\d{4}-\d{2}$'
        inscricao_estadual:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        telefone:
          type: string
          maxLength: 20
          nullable: true
        is_ativo:
          type: boolean
          default: true

    Produto:
      type: object
      properties:
        id:
          type: integer
        fornecedor_id:
          type: integer
        descricao:
          type: string
        codigo_comercial:
          type: string
        codigo_barras:
          type: string
          nullable: true
        unidade:
          type: string
          example: "UN"
        quantidade_caixa:
          type: number
          format: decimal
        preco_custo:
          type: number
          format: decimal
        preco_tabela:
          type: number
          format: decimal
        margem:
          type: number
          format: decimal
          description: "Calculated margin percentage"
        is_ativo:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProdutoCreate:
      type: object
      required:
        - fornecedor_id
        - descricao
        - codigo_comercial
        - unidade
        - preco_custo
        - preco_tabela
      properties:
        fornecedor_id:
          type: integer
        descricao:
          type: string
          maxLength: 255
        codigo_comercial:
          type: string
          maxLength: 50
        codigo_barras:
          type: string
          maxLength: 50
          nullable: true
        unidade:
          type: string
          maxLength: 10
        quantidade_caixa:
          type: number
          format: decimal
          minimum: 1
        preco_custo:
          type: number
          format: decimal
          minimum: 0
        preco_tabela:
          type: number
          format: decimal
          minimum: 0
        is_ativo:
          type: boolean
          default: true

    # ============================================
    # ESTOQUE (INVENTORY) SCHEMAS
    # ============================================

    EstoqueLote:
      type: object
      properties:
        id:
          type: integer
        loja_id:
          type: integer
        nfe_item_id:
          type: integer
          nullable: true
        compra_id:
          type: integer
          nullable: true
        produto_id:
          type: integer
        fornecedor_id:
          type: integer
        quantidade:
          type: number
          format: decimal
        quantidade_disponivel:
          type: number
          format: decimal
        quantidade_reservada:
          type: number
          format: decimal
        custo_unitario:
          type: number
          format: decimal
        lote:
          type: string
          nullable: true
        data_entrada:
          type: string
          format: date-time
        data_validade:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [DISPONIVEL, RESERVADO, ESGOTADO, BLOQUEADO]
        bloco_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EstoqueLoteCreate:
      type: object
      required:
        - loja_id
        - produto_id
        - quantidade
        - custo_unitario
      properties:
        loja_id:
          type: integer
        nfe_item_id:
          type: integer
          nullable: true
        compra_id:
          type: integer
          nullable: true
        produto_id:
          type: integer
        fornecedor_id:
          type: integer
          nullable: true
        quantidade:
          type: number
          format: decimal
          minimum: 0
        custo_unitario:
          type: number
          format: decimal
          minimum: 0
        lote:
          type: string
          nullable: true
        data_validade:
          type: string
          format: date
          nullable: true
        bloco_id:
          type: integer
          nullable: true

    Alocacao:
      type: object
      properties:
        id:
          type: integer
        venda_item_id:
          type: integer
        estoque_lote_id:
          type: integer
        quantidade:
          type: number
          format: decimal
        status:
          type: string
          enum: [ATIVO, PARCIALMENTE_ESTORNADO, CANCELADA]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AlocacaoCreate:
      type: object
      required:
        - venda_item_id
        - estoque_lote_id
        - quantidade
      properties:
        venda_item_id:
          type: integer
        estoque_lote_id:
          type: integer
        quantidade:
          type: number
          format: decimal
          minimum: 0

    # ============================================
    # VENDAS (SALES) SCHEMAS
    # ============================================

    Orcamento:
      type: object
      properties:
        id:
          type: integer
        loja_id:
          type: integer
        cliente_id:
          type: integer
        vendedor_id:
          type: integer
          nullable: true
        status:
          type: string
          enum: [ATIVO, FECHADO, EXPIRADO, PERDIDO, REPLICADO]
        semaforo:
          type: string
          enum: [FRIO, MORNO, QUENTE]
        subtotal_bruto:
          type: number
          format: decimal
        subtotal_liquido:
          type: number
          format: decimal
        desconto_percentual:
          type: number
          format: decimal
        desconto_reais:
          type: number
          format: decimal
        frete:
          type: number
          format: decimal
        total:
          type: number
          format: decimal
        prazo_entrega:
          type: integer
          description: "Days"
        validade:
          type: string
          format: date
        representacao:
          type: boolean
        observacoes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrcamentoCreate:
      type: object
      required:
        - loja_id
        - cliente_id
      properties:
        loja_id:
          type: integer
        cliente_id:
          type: integer
        vendedor_id:
          type: integer
          nullable: true
        semaforo:
          type: string
          enum: [FRIO, MORNO, QUENTE]
        prazo_entrega:
          type: integer
          nullable: true
        validade:
          type: string
          format: date
          nullable: true
        representacao:
          type: boolean
          default: false
        observacoes:
          type: string
          nullable: true

    OrcamentoItem:
      type: object
      properties:
        id:
          type: integer
        orcamento_id:
          type: integer
        produto_id:
          type: integer
        quantidade:
          type: number
          format: decimal
        valor_unitario:
          type: number
          format: decimal
        desconto:
          type: number
          format: decimal
        valor_total:
          type: number
          format: decimal
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrcamentoItemCreate:
      type: object
      required:
        - produto_id
        - quantidade
        - valor_unitario
      properties:
        produto_id:
          type: integer
        quantidade:
          type: number
          format: decimal
          minimum: 0
        valor_unitario:
          type: number
          format: decimal
          minimum: 0
        desconto:
          type: number
          format: decimal
          default: 0

    Venda:
      type: object
      properties:
        id:
          type: integer
        loja_id:
          type: integer
        orcamento_id:
          type: integer
          nullable: true
        cliente_id:
          type: integer
        vendedor_id:
          type: integer
          nullable: true
        status:
          type: string
          enum: [PENDENTE, AGENDADA, ENTREGANDO, ENTREGUE, CANCELADA]
        subtotal_bruto:
          type: number
          format: decimal
        subtotal_liquido:
          type: number
          format: decimal
        desconto_percentual:
          type: number
          format: decimal
        desconto_reais:
          type: number
          format: decimal
        frete:
          type: number
          format: decimal
        total:
          type: number
          format: decimal
        prazo_entrega:
          type: integer
        representacao:
          type: boolean
        rt:
          type: boolean
        observacoes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VendaCreate:
      type: object
      required:
        - loja_id
        - cliente_id
      properties:
        loja_id:
          type: integer
        orcamento_id:
          type: integer
          nullable: true
        cliente_id:
          type: integer
        vendedor_id:
          type: integer
          nullable: true
        prazo_entrega:
          type: integer
          nullable: true
        representacao:
          type: boolean
          default: false
        rt:
          type: boolean
          default: false
        observacoes:
          type: string
          nullable: true

    VendaItem:
      type: object
      properties:
        id:
          type: integer
        venda_id:
          type: integer
        produto_id:
          type: integer
        quantidade:
          type: number
          format: decimal
        valor_unitario:
          type: number
          format: decimal
        desconto:
          type: number
          format: decimal
        valor_total:
          type: number
          format: decimal
        origem:
          type: string
          enum: [ESTOQUE, COMPRA]
          description: "ESTOQUE = from inventory, COMPRA = needs purchase order"
        status:
          type: string
          enum: [PENDENTE, ESTOQUE, ENTREGUE, CANCELADO]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VendaItemCreate:
      type: object
      required:
        - produto_id
        - quantidade
        - valor_unitario
        - origem
      properties:
        produto_id:
          type: integer
        quantidade:
          type: number
          format: decimal
          minimum: 0
        valor_unitario:
          type: number
          format: decimal
          minimum: 0
        desconto:
          type: number
          format: decimal
          default: 0
        origem:
          type: string
          enum: [ESTOQUE, COMPRA]

    # ============================================
    # COMPRAS (PURCHASES) SCHEMAS
    # ============================================

    PedidoCompra:
      type: object
      properties:
        id:
          type: integer
        loja_id:
          type: integer
        fornecedor_id:
          type: integer
        status:
          type: string
          enum: [PENDENTE, ENVIADO, RECEBIDO_PARCIAL, RECEBIDO, CANCELADO]
        data_pedido:
          type: string
          format: date-time
        data_entrega_prevista:
          type: string
          format: date
          nullable: true
        data_entrega_real:
          type: string
          format: date
          nullable: true
        total:
          type: number
          format: decimal
        observacoes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PedidoCompraCreate:
      type: object
      required:
        - loja_id
        - fornecedor_id
      properties:
        loja_id:
          type: integer
        fornecedor_id:
          type: integer
        data_entrega_prevista:
          type: string
          format: date
          nullable: true
        observacoes:
          type: string
          nullable: true

    PedidoCompraItem:
      type: object
      properties:
        id:
          type: integer
        pedido_compra_id:
          type: integer
        produto_id:
          type: integer
        quantidade:
          type: number
          format: decimal
        preco_unitario:
          type: number
          format: decimal
        total:
          type: number
          format: decimal
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PedidoCompraItemCreate:
      type: object
      required:
        - produto_id
        - quantidade
        - preco_unitario
      properties:
        produto_id:
          type: integer
        quantidade:
          type: number
          format: decimal
          minimum: 0
        preco_unitario:
          type: number
          format: decimal
          minimum: 0

    # ============================================
    # FINANCEIRO (FINANCIAL) SCHEMAS
    # ============================================

    FinanceiroParcela:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
          format: uuid
        loja_id:
          type: integer
        tipo:
          type: string
          enum: [RECEBER, PAGAR]
          description: "RECEBER = Accounts Receivable, PAGAR = Accounts Payable"
        cliente_id:
          type: integer
          nullable: true
        fornecedor_id:
          type: integer
          nullable: true
        valor:
          type: number
          format: decimal
        valor_pago:
          type: number
          format: decimal
          default: 0
        status:
          type: string
          enum: [PENDENTE, AGENDADO, PARCIAL, PAGO, RECEBIDO, ATRASADO, PROTESTADO, CANCELADO]
        data_vencimento:
          type: string
          format: date
        data_pagamento:
          type: string
          format: date
          nullable: true
        origem:
          type: string
          enum: [VENDA, COMPRA, NFE_ENTRADA, MANUAL, RENEGOCIACAO, DEVOLUCAO]
        venda_id:
          type: integer
          nullable: true
        compra_id:
          type: integer
          nullable: true
        observacoes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FinanceiroParcelaCreate:
      type: object
      required:
        - loja_id
        - tipo
        - valor
        - data_vencimento
      properties:
        loja_id:
          type: integer
        tipo:
          type: string
          enum: [RECEBER, PAGAR]
        cliente_id:
          type: integer
          nullable: true
        fornecedor_id:
          type: integer
          nullable: true
        valor:
          type: number
          format: decimal
          minimum: 0
        data_vencimento:
          type: string
          format: date
        origem:
          type: string
          enum: [VENDA, COMPRA, NFE_ENTRADA, MANUAL, RENEGOCIACAO, DEVOLUCAO]
          default: MANUAL
        venda_id:
          type: integer
          nullable: true
        compra_id:
          type: integer
          nullable: true
        observacoes:
          type: string
          nullable: true

    CentroCusto:
      type: object
      properties:
        id:
          type: integer
        codigo:
          type: string
        nome:
          type: string
        tipo:
          type: string
          enum: [OPERACIONAL, ADMINISTRATIVO, COMERCIAL]
          description: "Different from financeiro_parcelas.tipo - this is cost center classification"
        loja_id:
          type: integer
          nullable: true
        ativo:
          type: boolean
        created_at:
          type: string
          format: date-time

    CentroCustoCreate:
      type: object
      required:
        - codigo
        - nome
        - tipo
      properties:
        codigo:
          type: string
          maxLength: 20
        nome:
          type: string
          maxLength: 100
        tipo:
          type: string
          enum: [OPERACIONAL, ADMINISTRATIVO, COMERCIAL]
        loja_id:
          type: integer
          nullable: true
        ativo:
          type: boolean
          default: true

    # ============================================
    # LOGÍSTICA (LOGISTICS) SCHEMAS
    # ============================================

    Entrega:
      type: object
      properties:
        id:
          type: integer
        venda_id:
          type: integer
        transportadora_id:
          type: integer
          nullable: true
        status:
          type: string
          enum: [AGENDADA, COLETANDO, EM_TRANSITO, ENTREGUE, FALHA, CANCELADA]
        data_agendada:
          type: string
          format: date
        data_coleta:
          type: string
          format: date
          nullable: true
        data_entrega:
          type: string
          format: date
          nullable: true
        rastreamento:
          type: string
          nullable: true
        observacoes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EntregaCreate:
      type: object
      required:
        - venda_id
      properties:
        venda_id:
          type: integer
        transportadora_id:
          type: integer
          nullable: true
        data_agendada:
          type: string
          format: date
        rastreamento:
          type: string
          nullable: true
        observacoes:
          type: string
          nullable: true

    # ============================================
    # NFE (ELECTRONIC INVOICE) SCHEMAS
    # ============================================

    NFe:
      type: object
      properties:
        id:
          type: integer
        loja_id:
          type: integer
        numero:
          type: integer
        serie:
          type: integer
        chave:
          type: string
          description: "Chave de Acesso (44 digits)"
        status:
          type: string
          enum: [RASCUNHO, VALIDANDO, AUTORIZADA, REJEITADA, CANCELADA]
        tipo_documento:
          type: string
          enum: [ENTRADA, SAIDA]
        data_emissao:
          type: string
          format: date-time
        valor_total:
          type: number
          format: decimal
        xml:
          type: string
          nullable: true
        pdf:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NFeCreate:
      type: object
      required:
        - loja_id
        - numero
        - serie
        - tipo_documento
      properties:
        loja_id:
          type: integer
